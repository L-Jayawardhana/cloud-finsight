global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-service:8080"]

  - job_name: collector-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["collector-service:8081"]
