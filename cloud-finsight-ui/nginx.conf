server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # api-service isn't containerised in this repo yet — it runs on the host
    # via ./mvnw spring-boot:run, so we reach it through Docker's host gateway.
    location /api/ {
        proxy_pass http://host.docker.internal:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Keycloak's own paths have no /auth prefix (e.g. /realms/...), so the
    # trailing slash on both sides here strips /auth/ before forwarding.
    location /auth/ {
        proxy_pass http://keycloak:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: let React Router handle deep links (e.g. /recommendations/5)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
