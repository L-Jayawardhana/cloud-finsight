server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api-service:8080/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Keycloak is configured with KC_HTTP_RELATIVE_PATH=/auth, so it expects
    # requests under /auth itself - forward the prefix through as-is (no
    # rewrite). $http_host (not $host) preserves the port, and
    # X-Forwarded-Host/Proto let Keycloak (KC_PROXY_HEADERS=xforwarded) report
    # its own issuer/redirect URLs as http://localhost:3000/auth/... instead
    # of guessing a portless, prefixless hostname from the raw Host header.
    location /auth/ {
        proxy_pass http://keycloak:8080/auth/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # SPA fallback: let React Router handle deep links (e.g. /recommendations/5)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
