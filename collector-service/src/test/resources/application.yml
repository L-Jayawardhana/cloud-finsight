spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:finsight}
    username: ${POSTGRES_USER:finsight_user}
    password: ${POSTGRES_PASSWORD:finsight_123}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:finsight_123}
      timeout: 2000ms
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USER:finsight_user}
    password: ${RABBITMQ_PASSWORD:finsight_123}
    connection-timeout: 5000
    publisher-confirm-type: correlated

collector:
  scheduling:
    enabled: false
  azure-monitor:
    prometheus-query-endpoint: https://placeholder.prometheus.monitor.azure.com
  pricing:
    region: southeastasia
  scoring:
    cost-weight: 0.5
    reliability-weight: 0.3
    performance-weight: 0.2
