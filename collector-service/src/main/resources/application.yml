server:
  port: 8081

spring:
  flyway:
    enabled: false
  application:
    name: collector-service
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:finsight}
    username: ${POSTGRES_USER:finsight_user}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD}
      timeout: 2000ms
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USER:finsight_user}
    password: ${RABBITMQ_PASSWORD}
    connection-timeout: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

collector:
  scheduling:
    enabled: true
  interval-ms: 900000
  analysis:
    interval-ms: 900000
  pricing:
    interval-ms: 86400000
    region: southeastasia
