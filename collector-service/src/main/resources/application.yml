server:
  port: 8081

spring:
  flyway:
    enabled: false
  application:
    name: collector-service
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:finsight}
    username: ${POSTGRES_USER:finsight_user}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD}
      timeout: 2000ms
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USER:finsight_user}
    password: ${RABBITMQ_PASSWORD}
    connection-timeout: 5000
    publisher-confirm-type: correlated

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

collector:
  azure-monitor:
    prometheus-query-endpoint: https://amw-cloud-cost-platform-fthya7grcthgexcw.southeastasia.prometheus.monitor.azure.com
  scheduling:
    enabled: true
  interval-ms: 900000
  analysis:
    interval-ms: 900000
    rolling-window-days: 14
  scoring:
    cost-weight: 0.5
    reliability-weight: 0.3
    performance-weight: 0.2
  pricing:
    interval-ms: 86400000
    region: southeastasia
