apiVersion: 1

groups:
  - orgId: 1
    name: collector-alerts
    folder: Alerts
    interval: 1m
    rules:
      - uid: collector-errors-high
        title: Collector error rate high
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: collector_errors_total rate exceeded 3 in the last 5 minutes
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(rate(collector_errors_total[5m]))
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [3]
              refId: C
