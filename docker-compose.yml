name: cloud-finsight

services:
  postgres:
    image: postgres:16
    container_name: finsight-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finsight}
      POSTGRES_USER: ${POSTGRES_USER:-finsight_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finsight_user} -d ${POSTGRES_DB:-finsight}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: finsight-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: finsight-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-finsight_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"   # AMQP protocol port — used by Spring AMQP
      - "15672:15672" # Management UI — http://localhost:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    container_name: finsight-keycloak
    restart: unless-stopped
    command: start-dev --import-realm --health-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-finsight_user}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Without these, Keycloak infers its own issuer/redirect URLs from the
      # raw Host header of whatever request reaches it. Behind the frontend's
      # nginx proxy that header arrives as bare "localhost" (nginx's $host
      # drops the port, and Keycloak has no idea it's mounted under /auth),
      # so tokens ended up with issuer "http://localhost/realms/..." instead
      # of "http://localhost:3000/auth/realms/...". That mismatched what
      # keycloak-js and api-service both expect, causing every token to be
      # rejected and the SPA to loop: login -> 401 -> re-login -> ...
      # KC_HTTP_RELATIVE_PATH makes Keycloak itself serve (and expect) all
      # paths under /auth, matching nginx's proxy_pass. KC_PROXY_HEADERS
      # makes it trust nginx's X-Forwarded-Host/Proto for hostname/scheme.
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8180:8080"   # Keycloak admin console + token endpoint — http://localhost:8180/auth
      - "9000:9000"   # management port (health/metrics)
    volumes:
      - ./keycloak/cloud-finsight-realm.json:/opt/keycloak/data/import/cloud-finsight-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /auth/health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10

  api-service:
    build:
      context: ./api-service
      dockerfile: Dockerfile
    container_name: finsight-api-service
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finsight}
      POSTGRES_USER: ${POSTGRES_USER:-finsight_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-finsight_user}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      # Where api-service actually fetches signing keys from (must be
      # reachable from inside this container - the browser-facing
      # "localhost:3000/auth" is not). Accepted "iss" values are the
      # application's default (see application.yml's app.security.allowed-issuers) -
      # covers both this container's own http://localhost:3000/auth/...
      # tokens and the http://localhost:8180/auth/... tokens used by the
      # host-run :5173 Vite dev flow talking to this same container.
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/auth/realms/cloud-finsight/protocol/openid-connect/certs
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "8080:8080"   # api-service — http://localhost:8080
    volumes:
      - ./api-service/logs:/app/logs
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  collector-service:
    build:
      context: ./collector-service
      dockerfile: Dockerfile
    container_name: finsight-collector-service
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finsight}
      POSTGRES_USER: ${POSTGRES_USER:-finsight_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-finsight_user}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      # AzureCliCredential shells out to `az`, which reads its login cache from here.
      AZURE_CONFIG_DIR: /root/.azure
    ports:
      - "8081:8081"   # collector-service — http://localhost:8081
    volumes:
      - ./collector-service/logs:/app/logs
      - ${HOME}/.azure:/root/.azure
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./cloud-finsight-ui
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:3000/api/v1
        VITE_KEYCLOAK_URL: http://localhost:3000/auth
        VITE_KEYCLOAK_REALM: cloud-finsight
        VITE_KEYCLOAK_CLIENT_ID: cloud-finsight-spa
    container_name: finsight-frontend
    restart: unless-stopped
    ports:
      - "3000:80"   # Dashboard — http://localhost:3000
    depends_on:
      api-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: finsight-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"   # Prometheus UI — http://localhost:9090
    depends_on:
      api-service:
        condition: service_healthy
      collector-service:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.4.0
    container_name: finsight-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "3001:3000"   # Grafana UI — http://localhost:3001 (3000 is taken by the frontend)
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:3.3.2
    container_name: finsight-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"   # Loki push/query API
    volumes:
      - loki_data:/loki

  promtail:
    image: grafana/promtail:3.3.2
    container_name: finsight-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - ./api-service/logs:/var/log/api-service:ro
      - ./collector-service/logs:/var/log/collector-service:ro
    depends_on:
      - loki

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  loki_data:
