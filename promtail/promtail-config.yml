server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: api-service
    static_configs:
      - targets: [localhost]
        labels:
          service: api-service
          environment: local
          __path__: /var/log/api-service/*.log

  - job_name: collector-service
    static_configs:
      - targets: [localhost]
        labels:
          service: collector-service
          environment: local
          __path__: /var/log/collector-service/*.log
