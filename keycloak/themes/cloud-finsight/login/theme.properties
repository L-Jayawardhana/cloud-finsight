# Cloud FinSight — custom login theme
#
# Extends Keycloak's modern "keycloak.v2" theme (PatternFly v5) rather than
# replacing its FreeMarker templates: the parent theme already exposes CSS
# custom properties (--keycloak-bg-logo-url, --keycloak-card-top-color, and
# every --pf-v5-global--* token) specifically so a brand skin can be applied
# with CSS alone. See resources/css/styles.css for the actual overrides.
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css

# The app's own theme is light-only (color-scheme: light in index.css) - match
# it here so the login page doesn't flip to Keycloak's dark palette on an
# OS-level dark-mode preference while the rest of the app stays light.
darkMode=false
